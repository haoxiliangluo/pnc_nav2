version: '3.8'

services:
  pnc_nav:
    build:
      context: .
      dockerfile: Dockerfile.jazzy
    image: pnc_nav2:jazzy
    container_name: pnc_nav
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_DISTRO=jazzy
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /home/hao/pnc_nav2:/home/hao/pnc_nav2:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /dev:/dev
    working_dir: /home/hao/pnc_nav2
    stdin_open: true
    tty: true
    command: sleep infinity
