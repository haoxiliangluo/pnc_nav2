locomotion:
  ros__parameters:
    use_sim_time: true
    locomotion:
      plugin: "pnc_nav_locomotion::WheelLeggedLocomotion"
      instance_name: "go2w"
      cmd_vel_topic: "cmd_vel"
      joint_topic: "joint_commands"
      cmd_vel_timeout: 0.5
    go2w:
      frequency: 100.0
      body_height: 0.34        # 站立高度（抬高一点让小腿/轮子脱离地面）
      thigh_length: 0.213
      calf_length: 0.213
      wheel_radius: 0.057      # 实测校准：cmd 0.3 → 实际 0.19，反推半径 ≈0.057
      track: 0.35              # 左右轮距 (m)
      max_linear: 0.6
      max_wheel_speed: 25.0
      linear_scale: 1.15       # 实测标定（0.3 命令 → 0.26 实际）
      angular_scale: 1.75      # 实测标定（0.6 命令 → 0.34 实际）
      use_velocity_feedback: true   # 用 /odom 实测速度做闭环补偿
      velocity_gain: 2.0            # 补偿增益
      odom_topic: "odom"
