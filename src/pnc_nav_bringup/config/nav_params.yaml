# Navigation parameters for PNC Nav2
nav_server:
  ros__parameters:
    # --- 基本参数 ---
    control_frequency: 20.0          # 控制循环频率 (Hz)
    global_frame: "map"
    robot_frame: "base_link"

    # --- 目标容差 ---
    goal_tolerance_dist: 0.15        # 到达目标的距离容差 (m)
    goal_tolerance_angle: 0.1        # 到达目标的角度容差 (rad)
    max_planning_retries: 3

    # --- 插件选择 ---
    global_planner_plugin: "pnc_nav_planners::AStar2D"
    local_planner_plugin: "pnc_nav_planners::DWA2D"         # baseline 默认走 path_tracker；测试 DWA 时改为 "pnc_nav_planners::DWA2D"
    #path_tracker_plugin: "pnc_nav_planners::PurePursuit2D"

    # # --- Phase 1: 简单 2D costmap ---
    # costmap:
    #   frame_id: "map"
    #   origin_x: -5.0
    #   origin_y: -5.0
    #   width: 10.0
    #   height: 10.0
    #   resolution: 0.1
    #   robot_radius: 0.25
    #   inflation_radius: 0.5
    #   # 矩形障碍物: [min_x, min_y, max_x, max_y, ...]
    #   obstacles: [
    #     0.5, 1.95, 3.5, 2.05,
    #     -1.05, -2.0, -0.95, 2.0,
    #     1.25, -2.75, 2.75, -1.25,
    #     -4.0, -3.05, -2.0, -2.95,
    #     -3.05, 0.5, -2.95, 3.5
    #   ]
    map_adapter:
      occupied_threshold: 65        # 占用阈值：/map 中栅格值大于这个值，就认为是障碍物
      robot_radius: 0.25            # 机器人半径：机器人本体占用的安全半径，单位 m
      inflation_radius: 0.35         # 膨胀半径：障碍物向外扩展的安全距离，单位 m
      cost_scaling_factor: 3.0      # 代价衰减系数：数值越大，障碍物附近代价下降越快
      unknown_as_occupied: true     # 是否把未知区域当作障碍物：true 表示 unknown 不可通行
    # --- 全局规划器参数: 与插件实例名 global_planner 对齐 ---
    global_planner:
      resolution: 0.1              # 搜索分辨率 (m)
      heuristic_weight: 1.2        # 启发式权重
      max_iterations: 100000       # 最大迭代次数
      allow_unknown: false         # 是否允许穿越未知区域
      diagonal_movement: true      # 是否允许对角线移动
      bspline_sample_count: 10     # 二次 B 样条每段采样点数
      height_penalty: 2.0          # 高度变化惩罚系数
      use_3d: false                # Phase 1 只跑 2D

    # --- 路径跟踪器参数: 与插件实例名 path_tracker 对齐 ---
    path_tracker:
      lookahead_distance: 0.8      # 前视距离 (m)
      min_lookahead: 0.4
      max_lookahead: 1.8
      lookahead_gain: 0.5          # 速度自适应前视增益
      max_linear_vel: 0.25
      max_angular_vel: 0.6
      min_linear_vel: 0.03

    # --- 局部规划器参数: 与插件实例名 local_planner 对齐 ---
    local_planner:
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_vel_x: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      sim_time: 1.0
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 21
      dt: 0.1
      path_distance_bias: 32.0
      goal_distance_bias: 20.0
      obstacle_cost_bias: 0.3
      heading_distance_bias: 15.0
