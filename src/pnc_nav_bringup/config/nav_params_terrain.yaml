# Navigation parameters for PNC Nav2
nav_server:
  ros__parameters:
    # --- 基本参数 ---
    control_frequency: 20.0          # 控制循环频率 (Hz)
    global_frame: "map"
    robot_frame: "base_link"

    # --- 目标容差 ---
    goal_tolerance_dist: 0.15        # 到达目标的距离容差 (m)
    goal_tolerance_angle: 0.0        # 终点朝向容差 (rad)；0 = 只看距离，不要求朝向
    max_planning_retries: 3

    # --- 地形代价（Phase 3；需要 elevation_map_node 发布 /traversability_map）---
    use_elevation_costmap: false     # true = 全局规划叠加高程图的可通行性代价
    elevation_topic: "traversability_map"
    elevation_lethal_score: 0.2      # 可通行性低于它视为不可通行

    # --- 恢复行为 / feedback / 看门狗 ---
    recovery_spin_duration: 1.0     # 恢复时原地旋转时长 (s)
    recovery_angular_vel: 0.6       # 恢复时旋转角速度 (rad/s)
    feedback_eta_speed: 0.25       # 计算 ETA 的参考速度 (m/s)
    progress_timeout: 8.0          # 多久无位移判卡住 (s)，<=0 关闭
    progress_epsilon: 0.05         # 卡住判定的位移阈值 (m)
    tf_timeout_ticks: 50           # 连续多少次拿不到 TF 判失败
    recovery_collision_check: true  # 恢复旋转前做碰撞检查
    recovery_safety_radius: 0.35    # 旋转安全检查半径 (m)，应 >= robot_radius

    # --- 插件选择 ---
    global_planner_plugin: "pnc_nav_planners::AStar2D"
    # baseline：AStar2D + PurePursuit2D（已验证能到达目标）
    local_planner_plugin: "pnc_nav_planners::DWA2D"                                # 非空则优先用局部规划器；测 DWA 时填 "pnc_nav_planners::DWA2D"
    path_tracker_plugin: "pnc_nav_planners::PurePursuit2D"

    # # --- Phase 1: 简单 2D costmap ---
    # costmap:
    #   frame_id: "map"
    #   origin_x: -5.0
    #   origin_y: -5.0
    #   width: 10.0
    #   height: 10.0
    #   resolution: 0.1
    #   robot_radius: 0.25
    #   inflation_radius: 0.5
    #   # 矩形障碍物: [min_x, min_y, max_x, max_y, ...]
    #   obstacles: [
    #     0.5, 1.95, 3.5, 2.05,
    #     -1.05, -2.0, -0.95, 2.0,
    #     1.25, -2.75, 2.75, -1.25,
    #     -4.0, -3.05, -2.0, -2.95,
    #     -3.05, 0.5, -2.95, 3.5
    #   ]
    map_adapter:
      occupied_threshold: 65        # 占用阈值：/map 中栅格值大于这个值，就认为是障碍物
      robot_radius: 0.25            # 机器人半径：机器人本体占用的安全半径，单位 m
      inflation_radius: 0.35         # 膨胀半径：障碍物向外扩展的安全距离，单位 m
      cost_scaling_factor: 3.0      # 代价衰减系数：数值越大，障碍物附近代价下降越快
      unknown_as_occupied: true     # 是否把未知区域当作障碍物：true 表示 unknown 不可通行
    # --- 局部代价地图（滚动窗口 + 激光障碍层，给局部规划器用）---
    local_costmap:
      enable: true
      scan_topic: "nav_scan"        # 2D 激光（3D 车可改成处理后的话题）
      window_size: 8.0              # 窗口边长 (m)，机器人始终在中心
      resolution: 0.05              # 窗口分辨率 (m/cell)
      obstacle_ttl: 3.0             # 激光障碍点存活时间 (s)，超时自动消失
      max_range: 6.0                # 只使用该范围内的激光 (m)
      inflation_radius: 0.35        # 膨胀半径 (m)
      robot_radius: 0.25            # 内切半径 (m)
      cost_scaling_factor: 3.0      # 代价衰减系数
      include_static: true          # 是否把静态图障碍也叠进窗口
      unknown_as_occupied: false    # 窗口外按"未知"处理（false = 不当障碍）

      # --- 点云障碍层（3D 激光，2.5D 投影；2D 车留空即可）---
      cloud_topic: ""               # 填 "points" 启用（gz_3d_lidar 的点云话题）
      cloud_stride: 8               # 每 N 个点取一个（降采样，16 线约 2.9 万点/帧）
      cloud_min_z: 0.10             # 高度带下限（map 系，滤掉地面）
      cloud_max_z: 1.50             # 高度带上限（滤掉高处结构）
      cloud_max_range: 8.0          # 只取该水平距离内的点 (m)

    # --- 全局规划器参数: 与插件实例名 global_planner 对齐 ---
    global_planner:
      resolution: 0.1              # 搜索分辨率 (m)
      heuristic_weight: 1.2        # 启发式权重
      max_iterations: 100000       # 最大迭代次数
      allow_unknown: false         # 是否允许穿越未知区域
      diagonal_movement: true      # 是否允许对角线移动
      bspline_sample_count: 10     # 二次 B 样条每段采样点数
      height_penalty: 2.0          # 高度变化惩罚系数
      use_3d: false                # Phase 1 只跑 2D

    # --- 路径跟踪器参数: 与插件实例名 path_tracker 对齐 ---
    path_tracker:
      lookahead_distance: 0.8      # 前视距离 (m)
      min_lookahead: 0.4
      max_lookahead: 1.8
      lookahead_gain: 0.5          # 速度自适应前视增益
      max_linear_vel: 0.30
      max_angular_vel: 1.0
      min_linear_vel: 0.03
      rotate_threshold: 0.6        # |航向误差| 超过它 → 原地转（rad）
      rotate_gain: 2.5             # 原地转比例增益

    # --- 局部规划器参数: 与插件实例名 local_planner 对齐 ---
    local_planner:
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_vel_x: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      sim_time: 1.0
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 21
      dt: 0.1
      path_distance_bias: 16.0     # 横向偏离路径的权重（改用折线投影后可以调小）
      goal_distance_bias: 20.0     # 沿路径剩余里程的权重（驱动前进，防"原地不动"）
      obstacle_cost_bias: 0.3
      heading_distance_bias: 25.0
